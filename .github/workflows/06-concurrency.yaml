name: main-workflow
on: [push]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }} # main-workflow-main
  cancel-in-progress: true # if true present execution will be cancelled , then new trigger will happen
jobs:
  say-hello-job:
    runs-on: ubuntu-latest
    steps:
      - name: Greet Hello World
        run: sleep 120